<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后量子文本信道 - C-X 安全终端</title>
    <link rel="stylesheet" href="pq-style.css?v=1.1">
</head>
<body>
<div class="box">
    <a href="index.html" class="nav-home">← 返回控制台</a>
    <h1>🔮 后量子文本通信 <span class="algo-badge">ML-KEM-768</span></h1>

    <div class="card">
        <div class="ht"><span>身份凭证 (IDENTITY)</span><span id="led" style="color:#94a3b8">●</span></div>
        <label>助记句 (输入唯一口令生成身份)</label>
        <input type="text" id="tp" placeholder="在此输入您的专属口令，用于生成私钥" oninput="TA.rst()">
        <button class="btn" onclick="TA.init()" id="tb">初始化身份</button>
        <div id="trp" class="res"><div style="color:var(--s);margin-bottom:5px">我的 ML-KEM 公钥:</div><div id="tpk" style="color:var(--t);word-break:break-all"></div><button class="cp" onclick="CP('tpk',1)">复制公钥</button></div>
    </div>

    <div class="card">
        <div class="ht" onclick="ACS.tog()" style="cursor:pointer"><span>通讯录 (CONTACTS)</span><span id="car">▼</span></div>
        <div id="cpnl" style="display:none;margin-top:15px">
            <div class="trow"><button class="tbtn" onclick="PQ_Directory.exp()">📤 导出</button><button class="tbtn" onclick="PQ_Directory.imp()">📥 导入</button></div>
            <div class="abox"><input type="text" id="cid" placeholder="联系人 ID" class="ainp" style="flex:0.4"><input type="text" id="cnn" placeholder="昵称(可选)" class="ainp" style="flex:0.3"></div>
            <input type="text" id="cepk" placeholder="ML-KEM 公钥 (Base64)" style="margin-bottom:8px">
            <button class="btn" style="margin:0 0 15px 0;padding:10px;font-size:.9rem" onclick="ACS.add()">➕ 添加联系人</button>
            <div id="clst" style="max-height:200px;overflow-y:auto"></div>
        </div>
    </div>

    <div class="mtb"><div class="mt on" onclick="TS('e')" id="mt-e">加密模式</div><div class="mt" onclick="TS('d')" id="mt-d">解密模式</div></div>
    
    <div class="spl">
        <div class="card sp on" id="sp-e">
            <div class="ht">🔒 加密发送 (ENCRYPT)</div>
            <label>接收方 ML-KEM 公钥</label><input type="text" id="trk" placeholder="粘贴公钥或从通讯录选择">
            <label>明文内容</label><textarea id="tpt" placeholder="输入机密信息..."></textarea>
            <button class="btn" onclick="TA.enc()">执行加密</button>
            <div id="trc" class="res"><div id="tct" style="color:var(--t)"></div><button class="cp" onclick="CP('tct',1)">复制密文</button></div>
        </div>
        <div class="card sp" id="sp-d">
            <div class="ht">🔓 解密接收 (DECRYPT)</div>
            <label>密文数据</label><textarea id="tci" placeholder="粘贴收到的密文..."></textarea>
            <button class="btn green" onclick="TA.dec()">执行解密</button>
            <div id="trd" class="res"><div style="color:var(--a);margin-bottom:5px">解密结果:</div><div id="tdt" style="color:var(--t);font-weight:700;word-break:break-all"></div></div>
        </div>
    </div>
</div>

<script src="core.js?v=3.0"></script>
<script>
// Utility functions
var PQ_Utils = {
    b642buf: function(b64) {
        try {
            var bin = atob(b64.replace(/\s+/g, ''));
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes.buffer;
        } catch(e) { return null; }
    },
    buf2b64: function(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
};

// ML-KEM instance (loaded async)
var ml_kem768 = null;

// Load ML-KEM bundle dynamically
import('./lib/ml-kem.bundle.mjs').then(function(mod) {
    ml_kem768 = mod.ml_kem768;
    console.log('ML-KEM-768 loaded');
}).catch(function(e) {
    console.error('Failed to load ML-KEM:', e);
    T('后量子模块加载失败');
});

// Contacts directory
var PQ_Directory = {
    store: 'cx_pq_contacts',
    data: {},
    _onEncFill: null,

    load: function() {
        try { this.data = JSON.parse(localStorage.getItem(this.store)) || {}; }
        catch(e) { this.data = {}; }
    },
    save: function() { localStorage.setItem(this.store, JSON.stringify(this.data)); },
    getAll: function() { return Object.values(this.data); },
    add: function(id, encryptionPubkey, nickname) {
        this.data[id] = {
            id: id,
            nickname: nickname || (this.data[id] ? this.data[id].nickname : ''),
            encryption_pubkey: encryptionPubkey || '',
            timestamp: Date.now()
        };
        this.save();
    },
    remove: function(id) { delete this.data[id]; this.save(); },
    _esc: function(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); },
    _trunc: function(s) { if (!s) return '—'; return s.length > 32 ? s.substring(0, 16) + '...' + s.substring(s.length - 12) : s; },
    render: function(containerId) {
        var c = document.getElementById(containerId);
        if (!c) return;
        c.innerHTML = '';
        var all = this.getAll();
        if (!all.length) { c.innerHTML = '<div style="text-align:center;color:var(--ts);font-size:.8rem;padding:10px">空</div>'; return; }
        var self = this;
        var html = '';
        for (var i = 0; i < all.length; i++) {
            var e = all[i];
            var key = e.encryption_pubkey || '';
            var name = e.nickname || e.id;
            html += '<div class="crow"><div class="cinf" onclick="PQ_Directory._onRowClick(\'' + self._esc(e.id) + '\')"><div class="cnm">' + self._esc(name) + '</div><div class="cky"><span class="klbl">K:</span><span title="' + self._esc(key) + '">' + self._esc(self._trunc(key)) + '</span>' + (key ? '<span class="kcp" onclick="event.stopPropagation();CP(\'' + key.replace(/'/g,"\\'") + '\',false)">复制</span>' : '') + '</div></div><div class="cdel" onclick="if(confirm(\'确定删除？\')){PQ_Directory.remove(\'' + self._esc(e.id) + '\');PQ_Directory.render(\'' + containerId + '\')}">×</div></div>';
        }
        c.innerHTML = html;
    },
    _onRowClick: function(id) {
        var e = this.data[id];
        if (e && this._onEncFill && e.encryption_pubkey) this._onEncFill(e.encryption_pubkey);
    },
    exp: function() { if (!Object.keys(this.data).length) return T('列表为空'); CP(JSON.stringify(this.data), false); },
    imp: function() {
        var s = prompt('粘贴通讯录备份代码:');
        if (!s) return;
        try {
            var obj = JSON.parse(s);
            if (typeof obj !== 'object') throw 1;
            if (confirm('覆盖(OK) 还是 合并(Cancel)?')) { this.data = obj; }
            else { for (var k in obj) { if (obj.hasOwnProperty(k) && !this.data[k]) this.data[k] = obj[k]; } }
            this.save(); this.render('clst'); T('导入成功');
        } catch(e) { T('数据无效'); }
    }
};
PQ_Directory.load();
PQ_Directory._onEncFill = function(k) { $('trk').value = k; T('公钥已填入'); };
PQ_Directory.render('clst');

// TA - Text encryption
var TA = {
    c: { e: new TextEncoder(), d: new TextDecoder(), sk: null, pk: null },
    rst: function() { $('led').style.color = '#94a3b8'; $('tb').disabled = false; $('tb').innerText = "初始化身份"; $('trp').classList.remove('on'); },
    init: function() {
        var self = this;
        var tx = $('tp').value;
        if (!tx) return T('请输入口令');
        if (!ml_kem768) return T('后量子模块加载中，请稍候...');
        if (!window.crypto || !window.crypto.subtle) return T('当前环境不支持 Web Crypto API');
        var b = $('tb'); b.disabled = true; b.innerText = "计算中...";
        crypto.subtle.importKey("raw", self.c.e.encode(tx), { name: "PBKDF2" }, false, ["deriveBits"])
        .then(function(km) { return crypto.subtle.deriveBits({ name: "PBKDF2", salt: self.c.e.encode("CX-PQ"), iterations: 1e5, hash: "SHA-256" }, km, 512); })
        .then(function(sd) {
            var seed = new Uint8Array(sd);
            var kp = ml_kem768.keygen(seed);
            self.c.sk = kp.secretKey;
            self.c.pk = kp.publicKey;
            $('tpk').innerText = PQ_Utils.buf2b64(self.c.pk);
            $('trp').classList.add('on');
            $('led').style.color = 'var(--a)';
            b.innerText = "身份已激活";
        })
        .catch(function(e) { T('派生失败: ' + e); b.disabled = false; b.innerText = "初始化身份"; });
    },
    enc: function() {
        var self = this;
        if (!self.c.sk) return T('请先初始化身份');
        if (!ml_kem768) return T('模块加载中...');
        var theirPkB64 = $('trk').value;
        var plaintext = $('tpt').value;
        if (!theirPkB64 || !plaintext) return T('请填写公钥和明文');
        try {
            var theirPk = new Uint8Array(PQ_Utils.b642buf(theirPkB64));
            if (!theirPk || theirPk.byteLength !== 1184) throw "接收方公钥格式不符 (需要 1184 字节)";
            var result = ml_kem768.encapsulate(theirPk);
            var ct = result.cipherText;
            var ss = result.sharedSecret;
            crypto.subtle.importKey("raw", ss, "AES-GCM", false, ["encrypt"])
            .then(function(key) {
                var iv = crypto.getRandomValues(new Uint8Array(12));
                return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, self.c.e.encode(plaintext))
                .then(function(enc) {
                    var out = { ct: PQ_Utils.buf2b64(ct), iv: PQ_Utils.buf2b64(iv.buffer), c: PQ_Utils.buf2b64(enc) };
                    $('tct').innerText = PQ_Utils.buf2b64(self.c.e.encode(JSON.stringify(out)));
                    $('trc').classList.add('on');
                });
            })
            .catch(function(e) { T('加密失败: ' + e); });
        } catch(e) { T('错误: ' + e); }
    },
    dec: function() {
        var self = this;
        if (!self.c.sk) return T('请先初始化身份');
        if (!ml_kem768) return T('模块加载中...');
        var cipherB64 = $('tci').value;
        if (!cipherB64) return T('请粘贴密文');
        try {
            var j = JSON.parse(self.c.d.decode(PQ_Utils.b642buf(cipherB64)));
            var ct = new Uint8Array(PQ_Utils.b642buf(j.ct));
            var ss = ml_kem768.decapsulate(ct, self.c.sk);
            crypto.subtle.importKey("raw", ss, "AES-GCM", false, ["decrypt"])
            .then(function(key) {
                return crypto.subtle.decrypt({ name: "AES-GCM", iv: PQ_Utils.b642buf(j.iv) }, key, PQ_Utils.b642buf(j.c));
            })
            .then(function(dec) {
                $('tdt').innerText = self.c.d.decode(dec);
                $('trd').classList.add('on');
            })
            .catch(function(e) { $('tdt').innerText = "解密失败: " + e; $('trd').classList.add('on'); });
        } catch(e) { $('tdt').innerText = "解析失败: " + e; $('trd').classList.add('on'); }
    }
};

var ACS = {
    tog: function() {
        var p = $('cpnl'), a = $('car');
        if (p.style.display === 'none') { p.style.display = 'block'; a.innerText = '▲'; }
        else { p.style.display = 'none'; a.innerText = '▼'; }
    },
    add: function() {
        var id = $('cid').value.trim(), nn = $('cnn').value.trim(), epk = $('cepk').value.trim();
        if (!id) return T('请输入联系人 ID');
        if (!epk) return T('请输入 ML-KEM 公钥');
        PQ_Directory.add(id, epk, nn);
        $('cid').value = ''; $('cnn').value = ''; $('cepk').value = '';
        PQ_Directory.render('clst'); T('已添加');
    }
};
</script>
</body>
</html>
