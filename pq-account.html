<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后量子密钥管理 - C-X 安全终端</title>
    <link rel="stylesheet" href="pq-style.css?v=1.0">
</head>
<body>
<div class="box">
    <a href="index.html" class="nav-home">← 返回控制台</a>
    <h1>🔮 后量子密钥管理 <span class="algo-badge">ML-KEM + ML-DSA</span></h1>

    <div class="card">
        <div class="ht">身份凭证</div>
        <label>用户 ID</label>
        <input type="text" id="uid" placeholder="输入唯一用户标识">
        <label>助记词</label>
        <textarea id="mnemo" placeholder="输入助记词，用于派生后量子密钥对"></textarea>
        <button class="btn" onclick="PQAcc.derive()">派生密钥对</button>
        <div id="dkeys" class="res">
            <div style="color:var(--s);margin-bottom:5px">派生签名公钥 (ML-DSA-65):</div>
            <div id="dspk" style="color:var(--t);word-break:break-all"></div>
            <button class="cp" onclick="CP('dspk',1)">复制签名公钥</button>
            <div style="color:var(--s);margin-top:12px;margin-bottom:5px">派生加密公钥 (ML-KEM-768):</div>
            <div id="depk" style="color:var(--t);word-break:break-all"></div>
            <button class="cp" onclick="CP('depk',1)">复制加密公钥</button>
        </div>
    </div>

    <div class="card">
        <div class="ht">公钥信息</div>
        <label>签名公钥 (ML-DSA-65, Base64) — 1952 字节</label>
        <input type="text" id="spk" placeholder="ML-DSA-65 公钥 Base64">
        <label>加密公钥 (ML-KEM-768, Base64) — 1184 字节</label>
        <input type="text" id="epk" placeholder="ML-KEM-768 公钥 Base64">
        <div style="font-size:.75rem;color:var(--ts);margin-top:8px">签名公钥需与助记词匹配，否则自签名校验将失败。</div>
    </div>

    <div class="card">
        <div class="ht">导出密钥</div>
        <p style="font-size:.8rem;color:var(--ts);margin:0 0 10px">将公钥复制后手动分享给通讯对方（无服务器上传）。</p>
        <button class="btn" onclick="PQAcc.exportAll()">📤 导出完整公钥包</button>
        <div id="status" class="res"></div>
    </div>
</div>

<script src="core.js?v=3.0"></script>
<script>
var PQ_Utils = {
    b642buf: function(b64) { try { var bin = atob(b64.replace(/\s+/g, '')); var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return bytes.buffer; } catch(e) { return null; } },
    buf2b64: function(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
};

var ml_dsa65 = null, ml_kem768 = null;
Promise.all([
    import('./lib/ml-dsa.bundle.mjs').then(function(m) { ml_dsa65 = m.ml_dsa65; }),
    import('./lib/ml-kem.bundle.mjs').then(function(m) { ml_kem768 = m.ml_kem768; })
]).then(function() { console.log('ML-DSA-65 + ML-KEM-768 loaded'); })
.catch(function(e) { console.error('Load failed:', e); T('后量子模块加载失败'); });

var PQAcc = {
    enc: new TextEncoder(),
    kp_dsa: null, kp_kem: null,
    derive: function() {
        var self = this;
        var m = $('mnemo').value.trim();
        if (!m) return T('请输入助记词');
        if (!ml_dsa65 || !ml_kem768) return T('模块加载中，请稍候...');
        crypto.subtle.digest('SHA-256', self.enc.encode(m)).then(function(hashBuf) {
            var seed = new Uint8Array(hashBuf);
            self.kp_dsa = ml_dsa65.keygen(seed);
            $('dspk').innerText = PQ_Utils.buf2b64(self.kp_dsa.publicKey);
            $('spk').value = PQ_Utils.buf2b64(self.kp_dsa.publicKey);
            return crypto.subtle.importKey('raw', self.enc.encode(m), { name: 'PBKDF2' }, false, ['deriveBits']);
        }).then(function(km) {
            return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: self.enc.encode('CX-PQ-KEM'), iterations: 1e5, hash: 'SHA-256' }, km, 256);
        }).then(function(sd) {
            self.kp_kem = ml_kem768.keygen(new Uint8Array(sd).subarray(0, 32));
            $('depk').innerText = PQ_Utils.buf2b64(self.kp_kem.publicKey);
            $('epk').value = PQ_Utils.buf2b64(self.kp_kem.publicKey);
            $('dkeys').classList.add('on');
            T('密钥对已派生');
        }).catch(function(e) { T('派生失败: ' + e); });
    },
    exportAll: function() {
        var id = $('uid').value.trim(), spk = $('spk').value.trim(), epk = $('epk').value.trim();
        if (!id) return T('请输入 ID');
        if (!spk || !epk) return T('请先派生密钥对');
        var pkBundle = { id: id, signing_pubkey: spk, encryption_pubkey: epk, algorithm: 'ML-DSA-65 + ML-KEM-768', timestamp: Date.now() };
        var st = $('status'); st.classList.add('on');
        st.innerHTML = '<div style="color:var(--t);word-break:break-all">' + JSON.stringify(pkBundle, null, 2) + '</div>';
        CP(JSON.stringify(pkBundle), false); T('公钥包已复制');
    }
};
</script>
</body>
</html>
