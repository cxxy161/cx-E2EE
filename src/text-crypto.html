<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本信道 - C-X 安全终端</title>
    <link rel="stylesheet" href="theme.css?v=4.0">
    <script>
    /* 提前应用主题，避免刷新闪白（必须在 CSS 之后、body 之前） */
    (function () {
        try {
            var m = localStorage.getItem('cx_theme') || 'auto';
            var d = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
    </script>
</head>

<body>
<div class="box">
    <div class="topbar">
        <a href="index.html" class="nav-home">← 控制台</a>
        <h1>文本通信协议</h1>
        <span class="algo-badge">X25519 + AES-GCM</span>
        <div class="theme-sw" role="group" aria-label="主题切换">
            <button type="button" data-th="light" onclick="UI.setTheme('light')">☀ 浅</button>
            <button type="button" data-th="dark" onclick="UI.setTheme('dark')">🌙 深</button>
            <button type="button" data-th="auto" onclick="UI.setTheme('auto')">⚙ 自动</button>
        </div>
    </div>

    <!-- 纯 JS 回退加密警告条：仅非安全上下文（crypto.subtle 不可用）时出现 -->
    <div class="note warn" id="sc-warn" style="display:none;margin-bottom:14px">
        <span class="ic">⚠</span>
        <span id="sc-warn-tx"></span>
    </div>

    <!-- ═══ 身份凭证 ═══ -->
    <div class="card">
        <div class="ht">
            <span class="ht-l">🔑 身份凭证 <span class="en">IDENTITY</span></span>
            <span class="state" id="led"><span class="dot"></span><span id="led-t">未初始化</span></span>
        </div>

        <label for="tp">助记句 · 用于派生私钥（相同口令永远得到相同身份）</label>
        <div class="inline">
            <input type="text" id="tp" placeholder="输入您的专属口令" oninput="TA.onPassInput()">
        </div>
        <div class="fld-msg hint on">口令不会上传，仅在本机内存中派生密钥。改口令需重新初始化。</div>
        <div class="inline" style="margin-top:12px">
            <button class="btn sm" id="tb" onclick="TA.init()" style="flex:1">初始化身份</button>
            <button class="btn sm ghost" id="tclear" onclick="TA.clear()" style="flex:0 0 auto;width:auto;padding-left:18px;padding-right:18px">清除</button>
        </div>

        <!-- 我的公钥：常驻，不再随口令输入而消失 -->
        <div id="idbox" style="display:none;margin-top:16px">
            <label style="margin-top:0">我的加密公钥（把它发给对方，对方才能发消息给你）</label>
            <div class="secret">
                <code id="tpk" data-secret></code>
                <button class="mini" onclick="CP('tpk',1)">复制</button>
            </div>
        </div>

        <div class="note warn" id="idwarn" style="display:none;margin-top:14px;margin-bottom:0">
            <span class="ic">⚠</span>
            <span>口令已修改，当前身份仍是旧口令派生的。请点「初始化身份」重新派生，否则对方无法解密你发出的消息。</span>
        </div>
    </div>

    <!-- ═══ 通讯录 ═══ -->
    <div class="card">
        <div class="ht clickable" onclick="ACS.tog()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ACS.tog()}">
            <span class="ht-l">📇 通讯录 <span class="en">CONTACTS</span> <span class="state" id="car-n" style="display:none"></span></span>
            <span id="car">▼</span>
        </div>
        <div id="cpnl" style="display:none">
            <div class="abox inline" style="margin-bottom:12px">
                <input type="text" id="rid" placeholder="输入对方 ID，从服务器拉取公钥" class="ainp">
                <button class="suffix" onclick="ACS.pull()" id="rpull">🔍 拉取</button>
            </div>

            <div class="ht" style="font-size:.82rem;margin:16px 0 10px;border-bottom:none;padding-bottom:0">
                <span class="ht-l">✍️ 手动添加</span>
            </div>
            <div class="inline">
                <input type="text" id="cid" placeholder="联系人 ID（必填）" class="ainp">
                <input type="text" id="cnn" placeholder="昵称（可选）" class="ainp">
            </div>
            <label for="cepk">加密公钥（必填 · 32 字节 Base64）</label>
            <input type="text" id="cepk" placeholder="粘贴对方的加密公钥" oninput="ACS.valEpk()">
            <div class="fld-msg" id="cepk-msg"></div>
            <label for="cspk">签名公钥（可选 · 后续签名信道用）</label>
            <input type="text" id="cspk" placeholder="可留空" oninput="ACS.valSpk()">
            <div class="fld-msg" id="cspk-msg"></div>
            <button class="btn sm" onclick="ACS.add()" id="cadd" style="margin-top:14px">➕ 添加联系人</button>

            <div style="display:flex;gap:8px;margin-top:16px">
                <button class="tbtn" onclick="ACS.exp()">📤 导出通讯录</button>
                <button class="tbtn" onclick="ACS.imp()">📥 导入通讯录</button>
            </div>
            <div id="clst" style="max-height:240px;overflow-y:auto;margin-top:12px"></div>
        </div>
    </div>

    <!-- ═══ 加 / 解密 ═══ -->
    <div class="mtb" role="tablist">
        <div class="mt on" onclick="TS('e')" id="mt-e" role="tab" tabindex="0">🔒 加密发送</div>
        <div class="mt" onclick="TS('d')" id="mt-d" role="tab" tabindex="0">🔓 解密接收</div>
    </div>

    <div class="spl">
        <!-- 加密 -->
        <div class="card sp on" id="sp-e">
            <div class="ht"><span class="ht-l">🔒 加密发送 <span class="en">ENCRYPT</span></span></div>

            <label>接收方加密公钥</label>
            <div id="rk-list"></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
                <button class="btn ghost sm" id="rk-add" type="button" onclick="RKL.add(null,true)" style="width:auto;padding-left:16px;padding-right:16px">➕ 添加接收方</button>
                <button class="btn ghost sm" id="pick-btn" type="button" onclick="ACS.pick(event)" style="width:auto;padding-left:16px;padding-right:16px">📇 从通讯录选人</button>
            </div>
            <div class="meta" id="rk-who" style="margin-top:8px"></div>

            <label for="tpt">明文内容</label>
            <textarea id="tpt" placeholder="输入要发送的内容…" oninput="TA.onPlain()"></textarea>
            <div class="meta" id="tpt-meta">0 字 · 约 0 字节</div>

            <div class="hz-toggle">
                <input type="checkbox" id="hz-t" onchange="TA.onHz()">
                <span class="hz-slider" onclick="$('hz-t').click()" role="switch" aria-label="汉字密文"></span>
                <span class="hz-lb" onclick="$('hz-t').click()">汉字密文（对普通聊天软件更隐蔽）</span>
                <span class="hz-tag" id="hz-tag">关闭</span>
            </div>

            <div class="hz-toggle">
                <input type="checkbox" id="seg-t" onchange="TA.onSeg()">
                <span class="hz-slider" onclick="$('seg-t').click()" role="switch" aria-label="自动分段"></span>
                <span class="hz-lb" onclick="$('seg-t').click()">自动分段（密文超 2000 字符时按段切分，适配 QQ 单条上限）</span>
                <span class="hz-tag" id="seg-tag">关闭</span>
            </div>

            <button class="btn" onclick="TA.enc()" id="btn-enc">执行加密</button>
            <div id="trc" class="res">
                <div class="cap info" id="trc-cap">密文</div>
                <div class="val val-ct" id="tct"></div>
                <button class="cp" onclick="CP('tct',1)">📋 复制密文</button>
            </div>
            <div id="seg-box" style="display:none"></div>
        </div>

        <!-- 解密 -->
        <div class="card sp" id="sp-d">
            <div class="ht"><span class="ht-l">🔓 解密接收 <span class="en">DECRYPT</span></span></div>

            <label for="tci">密文数据</label>
            <textarea id="tci" placeholder="粘贴收到的密文（Base64 或汉字密文，自动识别）" oninput="TA.onCipher()"></textarea>
            <div class="meta" id="tci-meta"></div>

            <button class="btn green" onclick="TA.dec()" id="btn-dec">执行解密</button>
            <div id="trd" class="res">
                <div class="cap" id="trd-cap"></div>
                <div class="val plain val-ct" id="tdt"></div>
                <button class="cp" id="trd-cp" style="display:none" onclick="CP('tdt',1)">📋 复制明文</button>
            </div>
        </div>
    </div>
</div>

<!-- 联系人浮层选择器 -->
<div class="picker" id="picker" role="listbox" aria-label="选择联系人"></div>

<!-- 通用模态 -->
<div class="modal" id="modal">
    <div class="mbox" id="modal-box"></div>
</div>

<script src="hanzi-table-v2.js?v=2.0"></script>
<script src="core.js?v=3.1"></script>
<script src="cx-crypto.js?v=1.0"></script>
<script src="cx2.js?v=2.1"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   UI 工具层：主题 / 密钥显隐 / 模态 / 浮层选择器 / busy
   —— 全部在本页内实现，不修改 core.js 的全局行为
   ═══════════════════════════════════════════════════════════════════ */
const UI = {
    /* — 主题：light / dark / auto — */
    theme: 'auto',
    initTheme() {
        let m = 'auto';
        try { m = localStorage.getItem('cx_theme') || 'auto'; } catch (e) {}
        this.applyTheme(m, false);
        // auto 模式下跟随系统变化
        try {
            matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (this.theme === 'auto') this.applyTheme('auto', false);
            });
        } catch (e) {}
    },
    setTheme(m) { this.applyTheme(m, true); },
    applyTheme(m, persist) {
        this.theme = m;
        if (persist) { try { localStorage.setItem('cx_theme', m); } catch (e) {} }
        const dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.querySelectorAll('.theme-sw button').forEach(b => b.classList.toggle('on', b.dataset.th === m));
    },

    render(el, hidden) {
        const full = el.dataset.full || '';
        // 用 textContent 赋值，避免 innerText 触发的重排/转换干扰
        if (hidden) {
            el.textContent = full.length > 19 ? full.slice(0, 10) + '…' + full.slice(-6) : full;
            el.dataset.masked = '1';
        } else {
            el.textContent = full;
            el.dataset.masked = '0';
        }
    },
    /* 写入密钥（mask=false 时直接明文展示，公钥无隐藏必要） */
    setSecret(id, value, mask) {
        const el = $(id); if (!el) return;
        el.dataset.full = value;
        this.render(el, !!mask);
    },

    /* — busy 按钮态 — */
    busy(btn, on, label) {
        if (!btn) return;
        if (on) {
            if (!btn.dataset.orig) btn.dataset.orig = btn.textContent;
            btn.textContent = label || '⏳ 计算中…';
            btn.disabled = true; btn.classList.add('busy');
        } else {
            if (btn.dataset.orig) btn.textContent = btn.dataset.orig;
            btn.disabled = false; btn.classList.remove('busy');
            delete btn.dataset.orig;
        }
    },

    /* — 滚动到元素（让结果可见） — */
    reveal(el) {
        if (!el) return;
        requestAnimationFrame(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
    },

    /* — 时长格式化 — */
    when(ts) {
        if (!ts) return '';
        const d = new Date(ts), n = new Date();
        const p = x => String(x).padStart(2, '0');
        const hm = p(d.getHours()) + ':' + p(d.getMinutes());
        return (d.toDateString() === n.toDateString()) ? '今天 ' + hm : (d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + hm);
    }
};
UI.initTheme();

/* ── 通用模态（替代 prompt / confirm） ── */
const Modal = {
    _resolve: null,
    open(html, onMount) {
        $('modal-box').innerHTML = html;
        $('modal').classList.add('on');
        this._resolve = null;
        // 点遮罩关闭
        $('modal').onclick = e => { if (e.target === $('modal')) this.close(false); };
        document.addEventListener('keydown', this._esc);
        if (onMount) onMount($('modal-box'));
    },
    _esc: e => { if (e.key === 'Escape') Modal.close(false); },
    close(v) {
        $('modal').classList.remove('on');
        $('modal-box').innerHTML = '';
        document.removeEventListener('keydown', Modal._esc);
        const r = this._resolve;
        this._resolve = null;
        if (r) r(v);          // 先取出再清空，否则 choose() 的 await 永远拿不到值
    },
    /* 确认框 */
    confirm(title, desc, okLabel, danger) {
        return new Promise(res => {
            this.open(
                '<h3>' + title + '</h3><div class="mdesc">' + desc + '</div>' +
                '<div class="macts"><button class="btn ghost" onclick="Modal.close(false)">取消</button>' +
                '<button class="btn" id="md-ok" style="' + (danger ? 'background:linear-gradient(135deg,var(--danger),#c4443d)' : '') + '" onclick="Modal.close(true)">' + okLabel + '</button></div>'
            );
            this._resolve = res;          // open() 会清空 resolver，必须在其之后设置
            const ok = $('md-ok'); if (ok) setTimeout(() => ok.focus(), 30);
        });
    },
    /* 三选（导入时用） */
    choose(title, desc, opts) {
        return new Promise(res => {
            let h = '<h3>' + title + '</h3><div class="mdesc">' + desc + '</div><div class="macts" style="flex-direction:column">';
            opts.forEach((o, i) => {
                h += '<button class="btn' + (o.ghost ? ' ghost' : '') + '" data-i="' + i + '" style="width:100%">' + o.label + '</button>';
            });
            h += '</div>';
            this.open(h);
            this._resolve = res;          // open() 会清空 resolver，必须在其之后设置
            $('modal-box').querySelectorAll('[data-i]').forEach(b => {
                b.onclick = () => Modal.close(parseInt(b.dataset.i));
            });
        });
    }
};
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   加密引擎（与重构前完全一致：X25519 派生 + AES-GCM）
   —— 算法一行未改，只改调用与呈现
   ═══════════════════════════════════════════════════════════════════ */
const TA = {
    M: {
        P: 2n ** 255n - 19n, i(n) { return this.p(n, this.P - 2n); },
        p(b, e) { let r = 1n; b %= this.P; while (e > 0n) { if (e % 2n === 1n) r = (r * b) % this.P; b = (b * b) % this.P; e /= 2n; } return r; },
        m(s, p) {
            const k = new Uint8Array(s); k[0] &= 248; k[31] &= 127; k[31] |= 64;
            let n = 0n; for (let i = 31; i >= 0; i--) n = (n << 8n) + BigInt(k[i]);
            let u = 0n; if (p) for (let i = 31; i >= 0; i--) u = (u << 8n) + BigInt(p[i]); else u = 9n;
            let x1 = u, x2 = 1n, z2 = 0n, x3 = u, z3 = 1n, sw = 0n;
            for (let t = 254; t >= 0; t--) {
                const kt = (n >> BigInt(t)) & 1n; sw ^= kt; if (sw) { [x2, x3] = [x3, x2]; [z2, z3] = [z3, z2]; } sw = kt;
                const A = x2 + z2, AA = A * A, B = x2 - z2, BB = B * B, E = AA - BB, C = x3 + z3, D = x3 - z3, DA = D * A, CB = C * B, ad = DA + CB, su = DA - CB;
                x3 = ad * ad; z3 = x1 * (su * su); x2 = AA * BB; z2 = E * (AA + 121666n * E); x2 %= this.P; z2 %= this.P; x3 %= this.P; z3 %= this.P;
            }
            if (sw) { [x2, x3] = [x3, x2]; [z2, z3] = [z3, z2]; }
            const r = (x2 * this.i(z2)) % this.P; const b = new Uint8Array(32); let tp = r;
            for (let i = 0; i < 32; i++) { b[i] = Number(tp & 0xFFn); tp >>= 8n; } return b;
        }
    },
    c: {
        e: new TextEncoder(), d: new TextDecoder(), pr: null, pk: null,
        async init(tx) {
            if (!tx) throw "请输入口令";
            // 经 SC 门面：非安全上下文下自动回退纯 JS PBKDF2（不支持的浏览器才抛错）
            const sd = await SC.pbkdf2(this.e.encode(tx), this.e.encode("CX3"), 1e5, 32);
            this.pr = new Uint8Array(sd); this.pk = Util.buf2b64(TA.M.m(this.pr, null).buffer); return this.pk;
        },
        async run(k, t, d) {
            if (!this.pr) throw "请先初始化";
            await SC.ensure();          // 无 crypto.subtle 时回退纯 JS
            if (d) {
                const j = JSON.parse(this.d.decode(Util.b642buf(t)));
                const s = TA.M.m(this.pr, new Uint8Array(Util.b642buf(j.k)));
                return this.d.decode(await SC.gcmOpen(s, Util.b642buf(j.i), Util.b642buf(j.c)));
            } else {
                const e = SC.rand(32);
                const pubBuf = Util.b642buf(k);
                if (!pubBuf || pubBuf.byteLength !== 32) throw "接收方公钥格式损坏或长度不符";
                const s = TA.M.m(e, new Uint8Array(pubBuf));
                const v = SC.rand(12);
                const c = await SC.gcmSeal(s, v, this.e.encode(t));
                return Util.buf2b64(this.e.encode(JSON.stringify({ k: Util.buf2b64(TA.M.m(e, null).buffer), i: Util.buf2b64(v.buffer), c: Util.buf2b64(c) })));
            }
        }
    },

    /* ── 状态 ── */
    _pass: '', _oldPass: '', _ready: false, _busy: false,

    setState(kind, text) {
        const led = $('led'); if (!led) return;
        led.className = 'state' + (kind ? ' ' + kind : '');
        $('led-t').innerText = text;
    },
    /* 口令输入：只在"值确实变化"时降级状态，且不清空已生成的公钥 */
    onPassInput() {
        const v = $('tp').value || '';
        if (!this._ready) return;                 // 尚未初始化，无需提示
        if (v === this._oldPass) {               // 改回原口令 → 恢复
            $('idwarn').style.display = 'none';
            this.setState('ok', '身份已激活');
            this.updateGate();
            return;
        }
        $('idwarn').style.display = 'flex';
        this.setState('warn', '口令已修改');
        this.updateGate();
    },
    /* 加密按钮门控：未初始化 / 无接收方公钥 时禁用并给出原因 */
    updateGate() {
        const b = $('btn-enc'); if (!b) return;
        const reasons = [];
        if (!this._ready) reasons.push('请先初始化身份');
        // 用 RKL 维护的缓存结果，避免每次按键都重跑 atob/校验
        if (typeof RKL !== 'undefined') {
            const st = RKL._state || { n: 0, bad: false };
            if (!st.n) reasons.push('请至少填写 1 个接收方公钥');
            else if (st.bad) reasons.push('有接收方公钥格式不正确（需 32 字节 Base64）');
        }
        if (!($('tpt').value || '').trim()) reasons.push('请输入明文');
        b.disabled = reasons.length > 0;
        b.title = reasons.join(' · ');
        const bd = $('btn-dec');
        if (bd) {
            const r2 = [];
            if (!this._ready) r2.push('请先初始化身份');
            if (!($('tci').value || '').trim()) r2.push('请粘贴密文');
            bd.disabled = r2.length > 0;
            bd.title = r2.join(' · ');
        }
        /* 「从通讯录选人」由 RKL 面板内的按钮触发，此处不再门控 */
    },

    async doInit() {
        const btn = $('tb');
        const pass = $('tp').value || '';
        if (!pass) { T('请输入口令'); $('tp').focus(); return; }
        this._busy = true; UI.busy(btn, true, '⏳ 派生中…');
        try {
            const pk = await this.c.init(pass);
            this._pass = pass; this._oldPass = pass; this._ready = true;
            UI.setSecret('tpk', pk, false);
            $('idbox').style.display = 'block';
            $('idwarn').style.display = 'none';
            this.setState('ok', '身份已激活');
            T('身份已激活');
            UI.reveal($('idbox'));
        } catch (e) {
            this._ready = false;
            this.setState('', '未初始化');
            $('idwarn').style.display = 'none';
            T(String(e && e.message ? e.message : e));
        } finally {
            this._busy = false; UI.busy(btn, false); this.updateGate();
        }
    },
    init() { this.doInit(); },


    /* 助记句 明文/密文 切换 */
    clear() {
        this._ready = false; this.c.pr = null; this.c.pk = null;
        $('tp').value = ''; this._pass = ''; this._oldPass = '';
        $('idbox').style.display = 'none';
        $('idwarn').style.display = 'none';
        this.setState('', '未初始化');
        this.updateGate();
        T('已清除本机身份');
    },

    /* 明文输入计数 */
    onPlain() {
        const v = $('tpt').value || '';
        const bytes = new TextEncoder().encode(v).length;
        $('tpt-meta').innerText = v.length + ' 字 · 约 ' + bytes + ' 字节';
        this.updateGate();
    },
    onCipher() {
        const v = ($('tci').value || '').trim();
        if (!v) { $('tci-meta').innerText = ''; }
        else if (HanziCodec.isHanzi(v)) $('tci-meta').innerText = '识别为：汉字密文 · ' + v.length + ' 字';
        else $('tci-meta').innerText = '识别为：Base64 密文 · ' + v.length + ' 字符';
        $('trd').classList.remove('on');
        this.updateGate();
    },
    onHz() {
        const on = $('hz-t').checked;
        $('hz-tag').innerText = on ? '开启' : '关闭';
        try { localStorage.setItem('cx_hz', on ? '1' : '0'); } catch (e) {}
        if (on) T('已开启汉字密文：密文由常用汉字与符号组成，长度约为 Base64 的 55%');
    },
    /* 启动时静默恢复开关状态，不弹提示 */
    onHzSilent() {
        const el = $('hz-tag'); if (el) el.innerText = $('hz-t').checked ? '开启' : '关闭';
    },

    /* 自动分段开关（默认关；开启后仅在超长时切分） */
    SEG_ON: false,
    onSeg() {
        this.SEG_ON = $('seg-t').checked;
        $('seg-tag').innerText = this.SEG_ON ? '开启' : '关闭';
        try { localStorage.setItem('cx_seg', this.SEG_ON ? '1' : '0'); } catch (e) {}
        // 已加密则立即重算分段展示
        if (this._lastCipher) this.renderSegments(this._lastCipher);
        if (this.SEG_ON) {
            const n = this._lastCipher ? this._segments(this._lastCipher).length : 1;
            T(n > 1 ? '已开启自动分段：当前密文将分为 ' + n + ' 段' : '已开启自动分段：密文未超 2000 字符，不分段');
        }
    },

    /* 渲染分段（未开启开关时不展示分块，仅超长时提示） */
    _renderIfOn(cipher) {
        const box = $('seg-box');
        if (!box) return;
        if (!this.SEG_ON) {
            const n = this._segments(cipher).length;
            box.style.display = '';
            box.innerHTML = n > 1
                ? '<div class="seg-hd warn">⚠ 密文 ' + cipher.length + ' 字符，超过 QQ 单条上限 2000；开启「自动分段」可切分为 ' + n + ' 段</div>'
                : '';
            if (n <= 1) box.style.display = 'none';
            return;
        }
        this.renderSegments(cipher);
    },

    async enc() {
        if (this._busy) return;
        const btn = $('btn-enc');
        const keys = RKL.keys();
        const plain = $('tpt').value || '';
        if (!this._ready) return T('请先初始化身份');
        if (!keys.length) return T('请至少填写 1 个接收方公钥');
        if (RKL.hasBad()) return T('有接收方公钥格式不正确（需 32 字节 Base64）');
        if (!plain) return T('请输入明文内容');

        this._busy = true; UI.busy(btn, true, '⏳ 加密中…');
        try {
            // 一对多：content_key 只加密一次正文，逐收件人 wrap
            const raw = await CX2.encrypt(plain, keys);
            const useHanzi = $('hz-t').checked;
            const out = useHanzi ? HanziCodec.encode(Util.b642buf(raw)) : raw;
            $('tct').innerText = out;
            this._lastCipher = out;
            $('trc-cap').innerText = '密文 · ' + keys.length + ' 位接收方 · ' +
                (useHanzi ? '汉字密文 ' + out.length + ' 字' : 'Base64 ' + out.length + ' 字符');
            $('trc').classList.add('on');
            this._renderIfOn(out);
            UI.reveal($('trc'));
            T('加密完成，记得用「复制密文」发给对方');
        } catch (e) {
            T('加密失败：' + (e && e.message ? e.message : e));
        } finally {
            this._busy = false; UI.busy(btn, false); this.updateGate();
        }
    },

    async dec() {
        if (this._busy) return;
        const btn = $('btn-dec');
        let input = ($('tci').value || '').trim();
        if (!this._ready) return T('请先初始化身份');
        if (!input) return T('请粘贴密文');

        this._busy = true; UI.busy(btn, true, '⏳ 解密中…');
        const cap = $('trd-cap'), body = $('tdt'), box = $('trd'), cp = $('trd-cp');
        try {
            // ⓪ 先解析段头（可能是一整段、也可能被切成多段）
            const mg = this._mergeSegments(input);
            if (mg.incomplete) {
                // 段不全时给出精确缺口，而不是让它掉进「认证失败」
                throw {
                    cx: '收到第 ' + mg.got + '/' + mg.total + ' 段，还缺第 ' +
                        mg.missing.join('、') + ' 段。请把这条消息的全部段都粘贴进来（顺序不限）'
                };
            }
            input = mg.cipher;
            if (mg.total > 1) T('已合并 ' + mg.total + ' 段密文');
            // ① 自动识别汉字密文（v2 字库严格判定）
            if (HanziCodec.isHanzi(input)) {
                try {
                    input = Util.buf2b64(HanziCodec.decode(input).buffer);
                } catch (he) {
                    throw { cx: '这段内容看起来是汉字密文，但字库校验不通过，可能被改动过：' + he };
                }
            }
            // ② v2 结构预检，给出比「解密失败」更有用的原因
            const buf = Util.b642buf(input);
            if (!buf) throw { cx: '密文不是有效的 Base64，可能被截断、混入换行或复制不全' };
            const b = new Uint8Array(buf);
            if (b.length < 3) throw { cx: '密文过短，不是本工具生成的密文' };
            if (b[0] !== 0x02) {
                throw { cx: '密文版本不支持（0x' + b[0].toString(16) + '）。本版使用 v2 格式，旧版密文已不再兼容' };
            }

            // ③ 环境自检：把「没初始化身份」「浏览器不支持」等
            //    与真正的解密失败区分开，避免统统报成「认证失败」
            if (!this._ready || !this.c.pr) {
                throw { cx: '请先在顶部「初始化身份」——解密需要本机私钥' };
            }
            // 环境自检：crypto.subtle 缺失时 SC 会自动回退纯 JS 实现（见 cx-crypto.js）。
            // 这里只拦「原生与回退都不可用」—— 此时 SC.ensure() 会抛出带原因的明确错误。
            await SC.ensure();
            const text = await CX2.decrypt(input, this.c.pr);
            cap.className = 'cap ok'; cap.innerText = '✓ 解密成功';
            body.innerText = text;
            cp.style.display = '';
            box.classList.add('on');
            UI.reveal(box);
        } catch (e) {
            const msg = e && e.cx ? e.cx
                : '解密失败：' + (e && e.message ? e.message : e);
            cap.className = 'cap err'; cap.innerText = '✕ ' + msg;
            body.innerText = '';
            cp.style.display = 'none';
            box.classList.add('on');
            UI.reveal(box);
        } finally {
            this._busy = false; UI.busy(btn, false); this.updateGate();
        }
    },

    /* ── 密文分段（QQ 单条 2000 字符上限） ──
     * 默认关闭；开启后切分，且**段体必须是 8 的整数倍**。
     *
     * 为什么必须对齐 8 字：汉字编码是 11bit/字、周期 88bit（8 字 ↔ 11 字节）。
     * 若段体不是 8 的倍数，段与段之间的位流起点就落在 11bit 内部，
     * 接收方按段独立 decode 时全部错位 → 后续段整体乱码。
     * 故 body 取 floor((limit-headroom)/8)*8，保证每个段的边界都是 88bit 倍数。
     */
    SEG_LIMIT: 2000,
    SEG_ALIGN: 8,            // 8 字 = 88bit，与 11bit*8 的周期对齐

    _segments(cipher) {
        const limit = this.SEG_LIMIT;
        const headroom = 16;                     // 段头 "CX2|1/9|abcd|9:1|" 最大长度余量
        // 关键：向下取整到 8 的倍数，否则跨段位流错位
        const raw = limit - headroom;
        const body = Math.floor(raw / this.SEG_ALIGN) * this.SEG_ALIGN;
        if (cipher.length <= limit) return [cipher];
        const segs = [];
        for (let i = 0; i < cipher.length; i += body) {
            segs.push(cipher.slice(i, i + body));
        }
        return segs;
    },

    /* ── 接收侧：把带段头的文本还原成密文 ──
     *
     * 三种输入都要能处理：
     *   ① 完整单段（total=1 或无段头）→ 直接当密文用
     *   ② 多段齐全（任意顺序、含换行）→ 按序号拼回完整密文
     *   ③ 多段不全 → 返回已拼出的部分，并标记 incomplete，
     *      由调用方给出「收到第 N/M 段，还缺第 x、y 段」的明确提示。
     *      （旧实现直接抛错，用户看到的却是「认证失败」，指向完全错误）
     *
     * 返回 {cipher, total, got, missing, incomplete}
     */
    _mergeSegments(text) {
        const s = String(text || '');
        // 段头格式：CX2|seq/total|msgid|total:seq|
        const re = /CX2\|(\d+)\/(\d+)\|([A-Za-z0-9]+)\|(\d+):(\d+)\|/g;
        const found = [];
        let m;
        while ((m = re.exec(s)) !== null) {
            found.push({ at: m.index, end: re.lastIndex, total: +m[2], mid: m[3], i: +m[5] });
        }
        // 无段头：整段当密文（单段消息就是这种形态）
        if (!found.length) return { cipher: s.replace(/\s+/g, ''), total: 1, got: 1, missing: [], incomplete: false };

        // 按 msgid 分组（用户可能一次粘了多条消息）
        const groups = new Map();
        for (const f of found) {
            if (!groups.has(f.mid)) groups.set(f.mid, []);
            groups.get(f.mid).push(f);
        }
        // 取段数最多的一组作为本次要处理的消息
        let best = null;
        for (const [mid, list] of groups) if (!best || list.length > best.list.length) best = { mid, list };
        const { list } = best;

        const total = Math.max(...list.map(x => x.total));
        const have = new Map(list.map(x => [x.i, x]));
        const missing = [];
        for (let i = 1; i <= total; i++) if (!have.has(i)) missing.push(i);

        // 按序号拼接已收到的段体（段体从段头结束到下一个段头之前）
        let out = '';
        for (let i = 1; i <= total; i++) {
            const f = have.get(i);
            if (!f) continue;
            const next = list.find(x => x.at > f.at);
            const bodyEnd = next ? next.at : s.length;
            out += s.slice(f.end, bodyEnd).replace(/\s+/g, '');
        }
        return { cipher: out, total, got: list.length, missing, incomplete: missing.length > 0 };
    },

    /* 渲染分段结果：每段一个复制按钮 + 一个「复制全部」 */
    renderSegments(cipher) {
        const box = $('seg-box');
        if (!box) return;
        if (this.SEG_ON === false) { this._renderIfOn(cipher); return; }
        const segs = this._segments(cipher);
        if (segs.length <= 1) { box.innerHTML = ''; box.style.display = 'none'; return; }
        const mid = Math.random().toString(36).slice(2, 6);
        const total = segs.length;

        // 先算出每段的完整文本（含段头），供单独复制与「复制全部」共用
        this._segTexts = segs.map((s, i) =>
            'CX2|' + (i + 1) + '/' + total + '|' + mid + '|' + total + ':' + (i + 1) + '|' + s);

        let h = '<div class="seg-hd">✂ 已自动分段：<b>' + total + '</b> 段（每段 ≤ ' + this.SEG_LIMIT +
            ' 字符）。接收方把全部段一起粘贴即可解密，顺序不限。' +
            '<button class="seg-cp seg-all" type="button" data-all="1" style="margin-left:8px">📋 复制全部 ' + total + ' 段</button>' +
            '</div>';
        this._segTexts.forEach((withHead, i) => {
            h += '<div class="seg-item">' +
                '<span class="seg-no">第 ' + (i + 1) + ' 段 / ' + total + '</span>' +
                '<span class="seg-len">' + withHead.length + ' 字符</span>' +
                '<button class="seg-cp" type="button" data-seg="' + i + '">📋 复制本段</button>' +
                '</div>' +
                '<textarea class="seg-tx" readonly data-i="' + i + '">' + escHtml(withHead) + '</textarea>';
        });
        box.innerHTML = h;
        box.style.display = '';

        box.querySelectorAll('[data-seg]').forEach(b => {
            b.onclick = () => {
                const i = parseInt(b.dataset.seg, 10);
                this._copy(this._segTexts[i], b, '第 ' + (i + 1) + ' 段');
            };
        });
        const allBtn = box.querySelector('[data-all]');
        if (allBtn) {
            allBtn.onclick = () => this._copy(this._segTexts.join('\n\n'), allBtn, '全部 ' + total + ' 段');
        }
    },

    /* 复制文本（含非安全上下文回退） */
    _copy(text, btn, label) {
        const done = () => {
            const old = btn.textContent;
            btn.textContent = '✓ 已复制';
            btn.classList.add('done');
            setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1400);
            T((label || '') + '已复制');
        };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(done).catch(() => T('自动复制被浏览器拦截，请手动选中复制'));
            return;
        }
        // 非安全上下文：选中文本供手动复制
        try {
            const ta = document.createElement('textarea');
            ta.value = text; document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); ta.remove(); done();
        } catch (e) { T('请手动选中内容复制'); }
    }
};

/* ── 公钥校验（新增，治"截断公钥不报错"） ── */
const Key = {
    _b64(v) {
        const s = String(v || '').replace(/\s+/g, '');
        if (!s) return null;
        if (!/^[A-Za-z0-9+/]+={0,2}$/.test(s)) return null;
        try { const bin = atob(s); return bin.length; } catch (e) { return null; }
    },
    ok32(v) { return this._b64(v) === 32; },
    /* 返回 {state:'empty'|'ok'|'bad', msg} */
    check(v, label) {
        const s = String(v || '').trim();
        if (!s) return { state: 'empty', msg: '' };
        const n = this._b64(s);
        if (n === null) return { state: 'bad', msg: '不是有效的 Base64（含非法字符或填充错误）' };
        if (n !== 32) return { state: 'bad', msg: label + '应为 32 字节，当前解析出 ' + n + ' 字节' + (n < 32 ? '（疑似被截断）' : '（疑似粘贴了多余内容）') };
        return { state: 'ok', msg: '✓ 格式正确（32 字节）' };
    }
};

/* ═══════════════════════════════════════════════════════════════════
   多接收方公钥输入行（RKL）
   —— 每个公钥一个输入框，点 ➕ 增行、点 ✕ 删行
   —— 恒定保留一个空行在末尾，供直接粘贴
   ═══════════════════════════════════════════════════════════════════ */
var RKL = {
    _seq: 0,

    init() { if (!$('rk-list').children.length) this.add(); this.sync(); },

    /* 增行。focus=true 时自动聚焦新行 */
    add(val, focus) {
        const id = 'rk' + (++this._seq);
        const row = document.createElement('div');
        row.className = 'rk-row';
        row.innerHTML =
            '<input type="text" id="' + id + '" placeholder="粘贴 32 字节 Base64 公钥" autocomplete="off" spellcheck="false">' +
            '<button class="rk-act rm" type="button" title="删除这一行" data-rm="1">✕</button>';
        const inp = row.querySelector('input');
        inp.value = val || '';
        inp.addEventListener('input', () => {
            this.val(inp);
            if (inp.value.trim() && row === $('rk-list').lastElementChild) this.add(null, false);
            this.ensureTrailingEmpty();
            this.sync();
        });
        inp.addEventListener('paste', () => setTimeout(() => { this.val(inp); this.sync(); }, 0));
        inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); this.add(null, true); }
        });
        row.querySelector('[data-rm]').onclick = () => {
            const list = $('rk-list');
            if (list.children.length <= 1) { inp.value = ''; this.val(inp); this.sync(); return; }
            row.remove();
            this.ensureTrailingEmpty();
            this.sync();
        };
        $('rk-list').appendChild(row);
        if (focus) inp.focus();
        return inp;
    },

    /* 保证末尾恒有一个空行 */
    ensureTrailingEmpty() {
        const list = $('rk-list');
        const last = list.lastElementChild;
        if (!last || last.querySelector('input').value.trim()) this.add(null, false);
    },

    /* 校验状态缓存：{n: 有效公钥数, bad: 是否有格式错误的行}
     * 由 sync() 在「输入稳定后」统一刷新，updateGate 只读它，
     * 避免每次按键都遍历 DOM + atob。 */
    _state: { n: 0, bad: false },

    /* 单行校验：返回 {state,msg}，并把结果画到输入框上 */
    val(inp) {
        const v = (inp.value || '').trim();
        if (!v) { inp.classList.remove('bad', 'ok'); return { state: 'empty', msg: '' }; }
        const r = Key.check(v, '接收方公钥');
        inp.classList.toggle('bad', r.state === 'bad');
        inp.classList.toggle('ok', r.state === 'ok');
        return r;
    },

    /* 只读缓存：有效公钥数 / 是否有错行（不触发校验） */
    get _n() { return this._state.n; },
    get _bad() { return this._state.bad; },

    /* 收集全部有效公钥（去重，保序）
     * 注意：这是**主动校验**，只在真正需要时调用（加密/解密/渲染），
     * 不要放进按键路径。 */
    keys() {
        const out = [], seen = new Set();
        $('rk-list').querySelectorAll('input').forEach(inp => {
            const v = (inp.value || '').trim();
            if (v && Key.ok32(v) && !seen.has(v)) { seen.add(v); out.push(v); }
        });
        return out;
    },

    /* 有无格式错误（非空但不合法）的行 —— 主动校验版 */
    hasBad() {
        let bad = false;
        $('rk-list').querySelectorAll('input').forEach(inp => {
            if (this.val(inp).state === 'bad') bad = true;
        });
        return bad;
    },

    /* 解析每个公钥归属：通讯录里是谁？自己？ */
    _resolve(k) {
        if (TA.c.pk && k === TA.c.pk) return '我自己的公钥';
        const hit = Object.values(Directory.data).find(c => c.encryption_pubkey === k);
        return hit ? (hit.nickname || hit.id) : null;
    },

    /* 更新「将发送给 N 人」确认条 + 计数徽标 */
    sync() {
        const el = $('rk-who'); if (!el) return;
        const keys = this.keys();
        // 刷新供 updateGate 读取的缓存
        this._state = {
            n: keys.length,
            bad: Array.prototype.some.call($('rk-list').querySelectorAll('input'),
                i => this.val(i).state === 'bad')
        };
        const dup = (() => {
            const all = [];
            $('rk-list').querySelectorAll('input').forEach(i => { const v = (i.value || '').trim(); if (v) all.push(v); });
            return all.length !== new Set(all).size;
        })();

        if (!keys.length) {
            el.innerHTML = this.hasBad()
                ? '<span style="color:var(--danger)">✕ 有公钥格式不正确（需 32 字节 Base64）</span>'
                : '填入至少 1 个接收方公钥后即可加密';
        } else {
            const names = keys.map(k => this._resolve(k) || (k.slice(0, 8) + '…' + k.slice(-4)));
            const self = names.indexOf('我自己的公钥') >= 0;
            el.innerHTML = '📢 将发送给 <b>' + keys.length + '</b> 人：' + escHtml(names.join('、')) +
                (self ? '<br><span style="color:var(--warn,#b8860b)">⚠ 名单含你自己的公钥，发出去你自己也能解</span>' : '') +
                (dup ? '<br><span style="color:var(--warn,#b8860b)">⚠ 有重复填写的公钥（已自动去重）</span>' : '');
        }
        TA.updateGate();
    },

    /* 从通讯录选人：填入第一个空行，没有空行则新增 */
    fill(k, name) {
        const list = $('rk-list');
        let target = null;
        list.querySelectorAll('input').forEach(inp => {
            if (!target && !(inp.value || '').trim()) target = inp;
        });
        if (!target) target = this.add(null, false);
        // 已在名单里则不重复添加
        const exists = this.keys().indexOf(k) >= 0;
        if (exists) { T('该公钥已在接收方名单中'); return; }
        target.value = k;
        this.val(target);
        this.ensureTrailingEmpty();
        this.sync();
        T('已添加接收方：' + (name || k.slice(0, 10) + '…'));
    },

    /* 清空全部（加密后调用可选） */
    clear() {
        $('rk-list').innerHTML = '';
        this._seq = 0;
        this.add();
        this.sync();
    }
};

/* ═══════════════════════════════════════════════════════════════════
   通讯录增强（本页内实现：校验 / 浮层选人 / 模态导入导出）
   —— 不改 core.js 的 Directory 算法与其在其它页面的行为
   ═══════════════════════════════════════════════════════════════════ */
Directory._onEncFill = function (k) { RKL.fill(k); };

var ACS = {
    _selfId: '',
    tog() {
        const p = $('cpnl'), a = $('car');
        const open = p.style.display === 'none';
        p.style.display = open ? 'block' : 'none';
        a.innerText = open ? '▲' : '▼';
        if (open) this.focusLater('rid');
    },

    /* 字段级校验：即时反馈 + 高亮 */
    _paint(inputId, msgId, res) {
        const inp = $(inputId), msg = $(msgId);
        if (!inp || !msg) return;
        inp.classList.toggle('bad', res.state === 'bad');
        msg.className = 'fld-msg' + (res.msg ? ' on' : '') + (res.state === 'bad' ? ' err' : res.state === 'ok' ? '' : ' hint');
        msg.innerText = res.msg;
        msg.style.color = res.state === 'ok' ? 'var(--ok)' : '';
    },
    valEpk() {
        const r = Key.check($('cepk').value, '加密公钥');
        this._paint('cepk', 'cepk-msg', r);
        this._gate();
        return r;
    },
    valSpk() {
        // 本页的签名公钥字段是前瞻占位：没填 → 提示可留空；填了 → 同样按 32 字节 Ed25519 校验
        const v = ($('cspk').value || '').trim();
        const r = v ? Key.check(v, '签名公钥') : { state: 'empty', msg: '可留空（本页不校验签名，隐私钥仅供「数字签名」页使用）' };
        this._paint('cspk', 'cspk-msg', r);
        this._gate();
        return r;
    },
    /* 公钥归属解析已移入 RKL._resolve（支持多接收方） */
    _gate() {
        const b = $('cadd'); if (!b) return;
        const id = ($('cid').value || '').trim();
        const e = Key.check($('cepk').value);
        const s = ($('cspk').value || '').trim() ? Key.check($('cspk').value) : { state: 'empty' };
        const bad = !id || e.state !== 'ok' || s.state === 'bad';
        b.disabled = bad;
        b.title = !id ? '请填写联系人 ID' : (e.state !== 'ok' ? '请填写正确的加密公钥' : (s.state === 'bad' ? '签名公钥格式有误' : ''));
    },

    add() {
        const id = ($('cid').value || '').trim();
        const nn = ($('cnn').value || '').trim();
        const epk = ($('cepk').value || '').trim();
        const spk = ($('cspk').value || '').trim();
        if (!id) { T('请输入联系人 ID'); $('cid').focus(); return; }
        const ec = Key.check(epk);
        if (ec.state !== 'ok') { T('加密公钥无效：' + (ec.msg || '必填')); $('cepk').focus(); return; }
        if (spk && Key.check(spk).state !== 'ok') { T('签名公钥格式有误，请检查或留空'); $('cspk').focus(); return; }
        if (Directory.data[id] && !confirm('ID「' + id + '」已存在，是否覆盖？')) return;
        Directory.add(id, spk, epk, nn);
        ['cid', 'cnn', 'cepk', 'cspk'].forEach(k => $(k).value = '');
        this.valEpk(); this.valSpk();
        this.renderList();
        T('已添加联系人：' + (nn || id));
    },

    /* ── 浮层选人：不必展开通讯录就能选 ── */
    pick(ev) {
        if (ev) ev.stopPropagation();
        const box = $('picker');
        const all = Object.values(Directory.data).filter(c => c.encryption_pubkey);
        let h = '';
        if (!all.length) {
            h = '<div class="pk-empty">通讯录为空<br><span style="font-size:.72rem">先展开「通讯录」添加联系人或从服务器拉取</span></div>';
        } else {
            const chosen = RKL.keys();
            all.forEach(c => {
                const nm = c.nickname || c.id;
                const on = chosen.indexOf(c.encryption_pubkey) >= 0;
                h += '<div class="pk-row" onclick="ACS.choose(\'' + escapeAttr(c.id) + '\')">' +
                    '<div style="flex:1;min-width:0"><div class="pk-nm">' + escHtml(nm) +
                    (on ? ' <span style="color:var(--ok);font-size:.72rem">✓ 已选</span>' : '') + '</div>' +
                    '<div class="pk-ky">' + escHtml(c.encryption_pubkey.slice(0, 12) + '…' + c.encryption_pubkey.slice(-6)) + '</div></div></div>';
            });
            h += '<div style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px">' +
                '<div class="pk-row" onclick="ACS.openContacts()"><div class="pk-nm" style="color:var(--accent-600)">＋ 管理通讯录</div></div></div>';
        }
        box.innerHTML = h;
        const anchor = (ev && ev.currentTarget) ? ev.currentTarget : $('pick-btn');
        const r = anchor.getBoundingClientRect();
        box.style.minWidth = Math.max(240, r.width + 60) + 'px';
        box.classList.add('on');
        // 先显示再量尺寸，避免越界
        const bh = box.getBoundingClientRect();
        let left = r.left, top = r.bottom + 6;
        if (left + bh.width > innerWidth - 12) left = innerWidth - bh.width - 12;
        if (top + bh.height > innerHeight - 12) top = r.top - bh.height - 6;
        box.style.left = Math.max(12, left) + 'px';
        box.style.top = Math.max(12, top) + 'px';
        box.onclick = e => e.stopPropagation();
    },
    choose(id) {
        const c = Directory.data[id]; if (!c) return;
        RKL.fill(c.encryption_pubkey, c.nickname || c.id);
        this.close();
    },
    openContacts() {
        this.close();
        if ($('cpnl').style.display === 'none') this.tog();
        $('cpnl').scrollIntoView({ behavior: 'smooth', block: 'center' });
    },
    close() { $('picker').classList.remove('on'); },

    /* 延迟聚焦：元素可能已被关闭的模态移除，取不到就静默跳过 */
    focusLater(id) {
        setTimeout(() => { const el = $(id); if (el) el.focus(); }, 40);
    },

    /* ── 导入 / 导出（模态替换 prompt / confirm） ── */
    async exp() {
        const n = Object.keys(Directory.data).length;
        if (!n) return T('通讯录为空');
        const json = JSON.stringify(Directory.data);
        Modal.open(
            '<h3>导出通讯录</h3>' +
            '<div class="mdesc">共 ' + n + ' 位联系人。复制下方内容，或下载为文件备份到安全的地方（包含公钥，不含私钥）。</div>' +
            '<textarea id="exp-txt" readonly style="min-height:130px;font-size:.74rem">' + escHtml(json) + '</textarea>' +
            '<div class="macts" style="margin-top:14px">' +
            '<button class="btn ghost" onclick="Modal.close(false)">关闭</button>' +
            '<button class="btn ghost" id="exp-dl">📥 下载文件</button>' +
            '<button class="btn" id="exp-cp">📋 复制</button></div>'
        );
        const expCp = $('exp-cp'), expDl = $('exp-dl');
        if (expCp) expCp.onclick = () => { CP('exp-txt', 1); };
        if (expDl) expDl.onclick = () => {
            const blob = new Blob([json], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'cx-contacts-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a); a.click();
            setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
            T('已下载备份文件');
        };
    },
    imp() {
        Modal.open(
            '<h3>导入通讯录</h3>' +
            '<div class="mdesc">粘贴之前导出的备份内容。导入前会先校验格式。</div>' +
            '<textarea id="imp-txt" placeholder="粘贴通讯录备份内容…" style="min-height:130px;font-size:.74rem"></textarea>' +
            '<div class="fld-msg" id="imp-msg"></div>' +
            '<div class="macts" style="margin-top:14px">' +
            '<button class="btn ghost" onclick="Modal.close(false)">取消</button>' +
            '<button class="btn" id="imp-next">下一步</button></div>'
        );
        this.focusLater('imp-txt');
        const impNext = $('imp-next');
        if (impNext) impNext.onclick = async () => {
            let obj;
            try { obj = JSON.parse($('imp-txt').value); } catch (e) { T('内容不是有效的 JSON'); return; }
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) { T('格式不对：应为「ID → 联系人」的对象'); return; }
            const keys = Object.keys(obj);
            if (!keys.length) { T('备份内容为空'); return; }
            const bad = keys.filter(k => !obj[k] || typeof obj[k] !== 'object');
            if (bad.length) { T('有 ' + bad.length + ' 条记录格式异常，已中止导入'); return; }
            const exist = keys.filter(k => Directory.data[k]).length;
            Modal.close(true);
            // 三选：覆盖 / 合并 / 取消（替代反人类的 confirm OK=覆盖 Cancel=合并）
            const idx = await Modal.choose(
                '导入 ' + keys.length + ' 位联系人',
                exist ? '其中 <b>' + exist + '</b> 位与现有记录 ID 相同，请选择处理方式：' : '通讯录中没有重复的 ID。',
                [
                    { label: '🔀 合并（保留现有，补充新的）' },
                    { label: '♻️ 覆盖（用备份替换全部）' },
                    { label: '取消', ghost: true }
                ]
            );
            if (idx === 0) {
                let added = 0;
                keys.forEach(k => { if (!Directory.data[k]) { Directory.data[k] = obj[k]; added++; } });
                Directory.save();
                this.renderList(); T('已合并，新增 ' + added + ' 位');
            } else if (idx === 1) {
                Directory.data = obj; Directory.save();
                this.renderList(); T('已覆盖，共 ' + keys.length + ' 位');
            }
        };
    },
    async pull() {
        const id = ($('rid').value || '').trim();
        if (!id) { T('请输入要检索的 ID'); $('rid').focus(); return; }
        const btn = $('rpull');
        UI.busy(btn, true, '⏳');
        try {
            const entry = await Directory.pullFromRemote(id);
            // 服务器上的签名公钥本页用不到，剔除后另存，避免污染本页通讯录
            if (entry && 'signing_pubkey' in entry) {
                delete entry.signing_pubkey;
                Directory.save();
                this.renderList();
            }
            $('rid').value = '';
            this.renderList();
            T('拉取成功：' + id);
        } catch (e) {
            T(String(e));
        } finally {
            UI.busy(btn, false);
        }
    },

    /* 列表渲染（在原 Directory.render 基础上补时间与高亮） */
    renderList() {
        Directory.render('clst', 'enc');
        const n = Object.keys(Directory.data).length;
        const badge = $('car-n');
        badge.style.display = n ? '' : 'none';
        badge.innerText = n + ' 位';
        this._gate();
        TA.updateGate();
    }
};

/* ── 小工具 ── */
function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function escapeAttr(s) { return escHtml(s).replace(/'/g, '&#39;'); }
let directory_self_id = '';
try { directory_self_id = localStorage.getItem('cx_self_id') || ''; } catch (e) {}

/* ── 点空白关闭浮层 ── */
document.addEventListener('click', () => ACS.close());

/* ── 窄屏切 Tab 后自动滚到面板顶部（治"点了没反应"） ── */
(function () {
    const _TS = window.TS;
    window.TS = function (t) {
        _TS(t);
        if (innerWidth < 900) {
            const el = $('sp-' + t);
            if (el) requestAnimationFrame(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }));
        }
    };
})();

/* ── 启动 ── */

/* 探测加密后端：非安全上下文会回退纯 JS，此时必须常驻警告（不能静默降级） */
SC.onMode = () => SC.mountNotice();
SC.ensure().catch(e => {
    // 原生与回退都不可用：直接告诉用户原因，而不是等到点按钮才报错
    const box = $('sc-warn'), tx = $('sc-warn-tx');
    if (box && tx) { tx.innerText = String(e && e.message ? e.message : e); box.style.display = 'flex'; }
});

RKL.init();
ACS.renderList();
TA.updateGate();
ACS.valSpk();
(function () {
    // 回填上次使用的自我 ID 提示
    if (directory_self_id) ACS._selfId = directory_self_id;
    // 恢复上次的汉字密文开关
    try { $('hz-t').checked = localStorage.getItem('cx_hz') === '1'; TA.onHzSilent(); } catch (e) {}
    // 恢复上次的自动分段开关（默认关）
    try { $('seg-t').checked = localStorage.getItem('cx_seg') === '1'; TA.onSeg(); } catch (e) {}
})();
/* Tab 键可达性：模式切换支持键盘 */
['mt-e', 'mt-d'].forEach(id => {
    const el = $(id); if (!el) return;
    el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    });
});
</script>
</body>
</html>
