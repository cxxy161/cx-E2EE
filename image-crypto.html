<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图片加密 - C-X 安全终端</title>
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
<div class="box">
    <a href="index.html" class="nav-home">← 返回控制台</a>
    <h1>图片混淆引擎</h1>

    <div class="card" style="padding:15px">
        <div class="ht" style="margin-bottom:10px;border:none">算法选择</div>
        <div class="as">
            <div class="ao on" onclick="IA.set('v1')" id="b-v1">V1 强加密 (高隐蔽)</div>
            <div class="ao" onclick="IA.set('v2')" id="b-v2">V2 抗干扰 (防压缩)</div>
        </div>
    </div>

    <div class="mtb"><div class="mt on" onclick="TS('e')" id="mt-e">加密图片</div><div class="mt" onclick="TS('d')" id="mt-d">解密图片</div></div>
    
    <div class="spl">
        <div class="card sp on" id="sp-e">
            <div class="ht">🔒 加密图片 (ENCRYPT)</div>
            <div class="drop" id="dr-e"><input type="file" accept="image/*" onchange="IA.ld(this,'e')"><div style="font-size:2rem">🖼️</div><div id="lb-e">点击或拖拽原图<br><span style="font-size:.8rem;color:#888">(支持 Ctrl+V)</span></div><img id="pv-e" class="p-img"></div>
            <label>设置密码</label><input type="text" id="ke" placeholder="输入加密密码 (请牢记)">
            <div id="pa-v1" style="margin-top:15px">
                <label>输出质量</label><div class="sr"><input type="range" id="qv1" min="10" max="100" value="80" oninput="IA.ui()"><span class="vt" id="vq1">80%</span></div>
            </div>
            <div id="pa-v2" style="margin-top:15px;display:none">
                <label>前置缩放</label><div class="sr"><input type="range" id="sv2" min="20" max="100" value="100" oninput="IA.ui()"><span class="vt" id="vs2">100%</span></div>
                <label>后置压缩</label><div class="sr"><input type="range" id="qv2" min="10" max="100" value="90" oninput="IA.ui()"><span class="vt" id="vq2">90%</span></div>
            </div>
            <button class="btn" onclick="IA.run('e')">生成加密图</button>
            <div id="rx-e" class="res"><img id="oe" class="p-img on" style="border-color:var(--a)"><div style="text-align:right;font-size:.75rem;margin-top:5px;color:#aaa" id="me"></div><button class="cp" onclick="IA.dl('e')">📥 保存图片</button></div>
        </div>
        
        <div class="card sp" id="sp-d">
            <div class="ht">🔓 解密图片 (DECRYPT)</div>
            <div class="drop" id="dr-d"><input type="file" accept="image/*" onchange="IA.ld(this,'d')"><div style="font-size:2rem">🔓</div><div id="lb-d">点击或拖拽乱码图<br><span style="font-size:.8rem;color:#888">(支持 Ctrl+V)</span></div><img id="pv-d" class="p-img"></div>
            <label>解密密码</label><input type="text" id="kd" placeholder="输入对应密码">
            <button class="btn green" onclick="IA.run('d')">开始还原</button>
            <div id="rx-d" class="res"><label style="color:var(--a)">还原结果:</label><img id="od" class="p-img on" style="border-color:var(--a)"><button class="cp" onclick="IA.dl('d')">📥 保存原图</button></div>
        </div>
    </div>
</div>
<canvas id="cvs" style="display:none"></canvas>
    <script src="core.js?v=1.0"></script>
<script>
const IA = {
    al: 'v1', fs: { e: null, d: null },
    hash(s) {
        let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
        for (let i = 0; i < s.length; i++) {
            let k = s.charCodeAt(i); h1 = h2 ^ Math.imul(h1 ^ k, 597399067); h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
            h3 = h4 ^ Math.imul(h3 ^ k, 951274213); h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
        }
        return h1 + h2 + h3 + h4;
    },
    rng(a) { return function() { var t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; } },
    perm(len, seed) { const r = this.rng(seed), p = new Uint32Array(len); for (let i = 0; i < len; i++) p[i] = i; for (let i = len - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } return p; },
    set(v) { this.al = v; $('b-v1').className = v === 'v1' ? 'ao on' : 'ao'; $('b-v2').className = v === 'v2' ? 'ao on' : 'ao'; $('pa-v1').style.display = v === 'v1' ? 'block' : 'none'; $('pa-v2').style.display = v === 'v2' ? 'block' : 'none'; },
    ui() { $('vq1').innerText = $('qv1').value == 100 ? "PNG" : $('qv1').value + "%"; $('vs2').innerText = $('sv2').value + "%"; $('vq2').innerText = $('qv2').value == 100 ? "PNG" : $('qv2').value + "%"; },
    ld(i, t) {
        const f = i.files[0]; if (!f) return; this.fs[t] = f;
        if (this.u) URL.revokeObjectURL(this.u); this.u = URL.createObjectURL(f);
        $('pv-' + t).src = this.u; $('pv-' + t).classList.add('on'); $('lb-' + t).style.display = 'none';
    },
    run(t) {
        const f = this.fs[t]; if (!f && !$('pv-' + t).src) return T("请先载入图片");
        const k = $('ke').value || $('kd').value; if (!k) return T("请输入密码");
        const img = new Image(); img.onload = () => { if (this.al === 'v1') this.pV1(img, k, t); else this.pV2(img, k, t); }; img.src = $('pv-' + t).src;
    },
    pV1(img, k, t) {
        const c = $('cvs'), x = c.getContext('2d'), w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (w * h > 16777216) { T("图片过大，可能导致崩溃"); return; }
        c.width = w; c.height = h; x.drawImage(img, 0, 0);
        const d = x.getImageData(0, 0, w, h).data, len = w * h, p = this.perm(len, this.hash(k)), b = new Uint8ClampedArray(d.length), E = t === 'e';
        if (E) for (let i = 0; i < len; i++) { const s = p[i] * 4, dst = i * 4; b[dst] = d[s]; b[dst + 1] = d[s + 1]; b[dst + 2] = d[s + 2]; b[dst + 3] = 255; }
        else for (let i = 0; i < len; i++) { const s = i * 4, dst = p[i] * 4; b[dst] = d[s]; b[dst + 1] = d[s + 1]; b[dst + 2] = d[s + 2]; b[dst + 3] = 255; }
        x.putImageData(new ImageData(b, w, h), 0, 0);
        let q = 1.0, m = 'image/png'; if (E) { const v = parseInt($('qv1').value); if (v < 100) { m = 'image/jpeg'; q = v / 100; } } this.fin(c, t, m, q);
    },
    pV2(img, k, t) {
        const c = $('cvs'), x = c.getContext('2d'), E = t === 'e'; let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (E) { const s = parseInt($('sv2').value) / 100; if (s < 1) { w = Math.floor(w * s); h = Math.floor(h * s); } }
        w = Math.floor(w / 8) * 8; h = Math.floor(h / 8) * 8; if (w < 8) w = 8; if (h < 8) h = 8;
        if (w * h > 16777216) { T("图片过大，可能导致崩溃"); return; }
        c.width = w; c.height = h; x.drawImage(img, 0, 0, w, h);
        const d = x.getImageData(0, 0, w, h).data, sd = this.hash(k), r = this.rng(sd), bl = w * h / 64, p = this.perm(bl, sd), cm = new Int32Array(bl), nr = this.rng(sd + 999);
        for (let i = 0; i < bl; i++) cm[i] = Math.floor(nr() * 1e6);
        const b = new Uint8ClampedArray(d.length), bx = w / 8, CM = v => 50 + (v / 255) * 155, EX = v => { let n = (v - 50) / 155; if (n < 0) n = 0; if (n > 1) n = 1; return n * 255; };
        for (let i = 0; i < bl; i++) {
            let si, di; if (E) { si = i; di = p[i]; } else { si = p[i]; di = i; }
            const sx = (si % bx) * 8, sy = Math.floor(si / bx) * 8, dx = (di % bx) * 8, dy = Math.floor(di / bx) * 8;
            const rw = cm[E ? di : si], ns = (rw % 81) - 40, fU = rw & 0x100, fV = rw & 0x200, sw = rw & 0x400;
            for (let y = 0; y < 8; y++) for (let l = 0; l < 8; l++) {
                const sI = ((sy + y) * w + (sx + l)) * 4, dI = ((dy + y) * w + (dx + l)) * 4;
                let R = d[sI], G = d[sI + 1], B = d[sI + 2], Y = .299 * R + .587 * G + .114 * B, U = -.147 * R - .289 * G + .436 * B, V = .615 * R - .515 * G - .1 * B;
                if (E) { Y = CM(Y) + ns; if (sw) [U, V] = [V, U]; if (fU) U = -U; if (fV) V = -V; } else { if (fV) V = -V; if (fU) U = -U; if (sw) [U, V] = [V, U]; Y -= ns; Y = EX(Y); }
                R = Y + 1.14 * V; G = Y - .395 * U - .581 * V; B = Y + 2.032 * U; b[dI] = R; b[dI + 1] = G; b[dI + 2] = B; b[dI + 3] = 255;
            }
        }
        x.putImageData(new ImageData(b, w, h), 0, 0);
        let q = 1.0, m = 'image/png'; if (E) { const v = parseInt($('qv2').value); if (v < 100) { m = 'image/jpeg'; q = v / 100; } } this.fin(c, t, m, q);
    },
    fin(c, t, m, q) { const u = c.toDataURL(m, q), i = $('o' + t); i.src = u; $('rx-' + t).classList.add('on'); i.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); if (t === 'e') { const s = Math.round((u.length - 22) * .75); $('me').innerText = `格式:${m.split('/')[1].toUpperCase()}|大小:${s > 1e6 ? (s / 1e6).toFixed(2) + "MB" : (s / 1024).toFixed(0) + "KB"}`; } },
    dl(t) { const s = $('o' + t).src; if (s) { const a = document.createElement('a'); a.href = s; a.download = `CX_${this.al}_${Date.now()}.${s.includes('png') ? 'png' : 'jpg'}`; a.click(); } }
};

// 全局粘贴与拖拽支持
document.addEventListener('paste', e => {
    const it = e.clipboardData.items; let f = null; for (let i = 0; i < it.length; i++) if (it[i].type.includes('image')) { f = it[i].getAsFile(); break; } if (!f) return;
    const t = document.getElementById('sp-d').classList.contains('on') ? 'd' : 'e'; const dt = new DataTransfer(); dt.items.add(f); $('dr-' + t).querySelector('input').files = dt.files; IA.ld($('dr-' + t).querySelector('input'), t); T(`已粘贴到${t === 'd' ? '解密' : '加密'}框`);
});
['e', 'd'].forEach(t => {
    const d = $('dr-' + t);
    d.addEventListener('dragover', e => { e.preventDefault(); d.style.borderColor = 'var(--p)'; d.style.background = 'rgba(0,242,255,.1)'; });
    d.addEventListener('dragleave', e => { e.preventDefault(); d.style.borderColor = 'var(--b)'; d.style.background = 'rgba(0,0,0,.2)'; });
    d.addEventListener('drop', e => { e.preventDefault(); d.style.borderColor = 'var(--b)'; d.style.background = 'rgba(0,0,0,.2)'; if (e.dataTransfer.files[0]) { const i = d.querySelector('input'); i.files = e.dataTransfer.files; IA.ld(i, t); } });
});
</script>
</body>
</html>
